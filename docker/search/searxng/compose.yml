version: "3.7"

services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped

    # 👇 THIS IS THE FIX
    user: "0:0"

    ports:
      - "8082:8080"

    environment:
      BASE_URL: "http://localhost:8082"
      INSTANCE_NAME: "SearXNG"

    volumes:
      - searxng-data:/etc/searxng

volumes:
  searxng-data: