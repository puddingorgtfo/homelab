version: '3.8'

services:
  app:
    image: 'jc21/nginx-proxy-manager:latest'
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '81:81'
    environment:
      DB_MYSQL_HOST: "db"
      DB_MYSQL_PORT: 3306
      DB_MYSQL_USER: "npm"
      DB_MYSQL_PASSWORD: "CHANGE_ME_PASSWORD"
      DB_MYSQL_NAME: "npm"
    volumes:
      - npm-data:/data
      - npm-letsencrypt:/etc/letsencrypt
    depends_on:
      - db

  db:
    image: 'mysql:8.0'
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 'CHANGE_ME_PASSWORD'
      MYSQL_DATABASE: 'npm'
      MYSQL_USER: 'npm'
      MYSQL_PASSWORD: 'CHANGE_ME_PASSWORD'
    volumes:
      - npm-db:/var/lib/mysql

volumes:
  npm-data:
  npm-letsencrypt:
  npm-db: