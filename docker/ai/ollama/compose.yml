version: "3.8"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - /mnt/nas/ollama/models:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "24h"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - ollama_internal
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
    volumes:
      - /mnt/nas/open-webui/data:/app/backend/data
    expose:
      - "8080"
    depends_on:
      - ollama
    networks:
      - ollama_internal
      - npm_default
    restart: unless-stopped

networks:
  ollama_internal:
    driver: bridge
  npm_default:
    external: true
