version: "3.8"

services:
  postgres:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_USER: immich
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_DB: immich
    volumes:
      - /mnt/nas/immich/postgres:/var/lib/postgresql/data
    networks:
      - immich_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immich"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks:
      - immich_internal
    restart: unless-stopped

  immich-server:
    image: ghcr.io/immich-app/immich-server:release
    command: ["start.sh", "immich"]
    environment:
      TZ: ${TZ:-America/New_York}
      IMMICH_PUBLIC_URL: ${IMMICH_PUBLIC_URL}
      DB_HOSTNAME: postgres
      DB_PORT: "5432"
      DB_USERNAME: immich
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: redis
      REDIS_PORT: "6379"
      IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning:3003
      UPLOAD_LOCATION: /usr/src/app/upload
      LOG_LEVEL: ${IMMICH_LOG_LEVEL:-log}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - /mnt/nas/immich/upload:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${IMMICH_PORT:-2283}:2283"
    networks:
      - immich_internal
      - npm_default
    restart: unless-stopped

  immich-microservices:
    image: ghcr.io/immich-app/immich-server:release
    command: ["start.sh", "microservices"]
    environment:
      TZ: ${TZ:-America/New_York}
      IMMICH_PUBLIC_URL: ${IMMICH_PUBLIC_URL}
      DB_HOSTNAME: postgres
      DB_PORT: "5432"
      DB_USERNAME: immich
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: redis
      REDIS_PORT: "6379"
      IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning:3003
      UPLOAD_LOCATION: /usr/src/app/upload
      LOG_LEVEL: ${IMMICH_LOG_LEVEL:-log}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - /mnt/nas/immich/upload:/usr/src/app/upload
    networks:
      - immich_internal
    restart: unless-stopped

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:release
    volumes:
      - /mnt/nas/immich/model-cache:/cache
    expose:
      - "3003"
    networks:
      - immich_internal
    restart: unless-stopped

networks:
  immich_internal:
    driver: bridge
  npm_default:
    external: true