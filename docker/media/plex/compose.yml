version: "3.8"

services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    runtime: nvidia
    environment:
      PUID: 1000
      PGID: 1000
      TZ: America/New_York
      VERSION: docker
      PLEX_CLAIM: YOUR_PLEX_CLAIM_TOKEN
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
    volumes:
      - /srv/docker/plex/config:/config
      - /mnt/nas/movies:/movies
      - "/mnt/nas/Tv Shows:/tv"
    expose:
      - 32400
    networks:
      - npm_default
    restart: unless-stopped

networks:
  npm_default:
    external: true