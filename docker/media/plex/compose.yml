version: "3.8"

services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    runtime: nvidia
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-America/New_York}
      VERSION: docker
      PLEX_CLAIM: ${PLEX_CLAIM}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
    volumes:
      - /mnt/nas/docker-configs/plex:/config
      - ${MOVIES_PATH:-/mnt/nas/movies}:/movies
      - ${TV_PATH:-/mnt/nas/Tv Shows}:/tv
    expose:
      - 32400
    networks:
      - npm_default
    restart: unless-stopped

networks:
  npm_default:
    external: true