version: "3.8"

services:
  readarr:
    image: binhex/arch-readarr
    container_name: readarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - /srv/docker/readarr/config:/config
      - /mnt/nas/books:/books
      - /mnt/nas/downloads:/downloads
    expose:
      - 8787
    networks:
      - npm_default
    restart: unless-stopped

networks:
  npm_default:
    external: true