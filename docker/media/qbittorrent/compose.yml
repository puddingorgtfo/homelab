version: "3.8"

services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER:-mullvad}
      VPN_TYPE: ${VPN_TYPE:-openvpn}
      OPENVPN_USER: ${OPENVPN_USER}
      OPENVPN_PASSWORD: ${OPENVPN_PASSWORD}
      SERVER_COUNTRIES: ${VPN_SERVER_COUNTRIES:-US}
      TZ: ${TZ:-America/New_York}
      FIREWALL: ${VPN_FIREWALL:-"on"}
      FIREWALL_INPUT_PORTS: ${VPN_FIREWALL_PORTS:-8080}
    ports:
      - "${QBIT_PORT:-6881}:6881"
      - "${QBIT_PORT:-6881}:6881/udp"
    restart: unless-stopped
    networks:
      - npm_default

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    depends_on:
      - gluetun
    network_mode: "service:gluetun"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-America/New_York}
      WEBUI_PORT: ${WEBUI_PORT:-8080}
    volumes:
      - /mnt/nas/docker-configs/qbittorrent:/config
      - ${DOWNLOADS_PATH:-/mnt/nas/downloads}:/downloads
    restart: unless-stopped

networks:
  npm_default:
    external: true