version: "3.8"

services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      PUID: 1000
      PGID: 1000
      TZ: America/New_York
    volumes:
      - /srv/docker/prowlarr/config:/config
      - /mnt/nas/downloads:/downloads
    expose:
      - 9696
    networks:
      - npm_default
    restart: unless-stopped

networks:
  npm_default:
    external: true