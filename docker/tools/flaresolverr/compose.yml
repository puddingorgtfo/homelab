version: "3.8"

services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      LOG_LEVEL: info
      TZ: America/New_York
    expose:
      - 8191
    networks:
      - npm_default
    restart: unless-stopped

networks:
  npm_default:
    external: true